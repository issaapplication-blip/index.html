<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f58"><title>WISAL | التحقق من الهوية</title><style>body{margin:0;background:#f4f8f6;font-family:Arial,Tahoma,sans-serif;color:#17372d}main{max-width:620px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 5px 20px #0001}.logo{width:180px;display:block;margin:auto}.ok{background:#edf8f2;border-radius:12px;padding:14px}.warn{background:#fff5f6;border:1px solid #d71939;border-radius:12px;padding:14px}</style></head><body><main><section class="card"><img class="logo" src="./assets/wisal-logo.svg" alt="WISAL"><h1>التحقق من الهوية الإلكترونية</h1><p id="state">جاري التحقق...</p><div id="result"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const p=new URLSearchParams(location.search),token=p.get('t'),db=supabase.createClient('https://qmuxaehrahfsnabyjens.supabase.co','sb_publishable_AYoQSOTwTF1w3RT6CglKmA_WVcYUVlD');(async()=>{if(!token){document.querySelector('#state').textContent='رمز التحقق غير موجود.';return}const {data,error}=await db.from('identity_cards').select('id,card_type,status,created_at,member_id').eq('public_token',token).eq('status','active').maybeSingle();if(error||!data){document.querySelector('#state').textContent='تعذر التحقق من الرمز.';document.querySelector('#result').innerHTML='<div class="warn">الرمز غير صالح أو تم إلغاؤه.</div>';return}document.querySelector('#state').textContent='تم التحقق من الرمز.';document.querySelector('#result').innerHTML='<div class="ok"><b>هوية WISAL إلكترونية فعالة</b><br>نوع البطاقة: '+(data.card_type==='member'?'منتسب':'فرد عائلة')+'<br>رقم النظام: '+data.id+'</div><p>يتم عرض أقل قدر لازم من المعلومات لحماية الخصوصية.</p>'})();</script></body></html>
