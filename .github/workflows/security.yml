name: Security Checks

on:
  push:
    branches: [main, security-hardening-v1]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-pattern-audit:
    name: Basic repository secret-pattern audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked text for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(sk-proj-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]+|AKIA[0-9A-Z]{16})' -- ':!SECURITY.md'; then
            echo 'Potential credential pattern detected. Review the matching line before release.'
            exit 1
          fi
          echo 'No high-risk credential pattern found by this basic audit.'
