name: RAFIQ static site quality
on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ops/**'
      - '.github/workflows/site-quality.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ops/**'
      - '.github/workflows/site-quality.yml'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate links, redirects, sitemap and PWA assets
        run: python ops/verify-static-site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript files
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \\( -name '*.js' -o -name '*.mjs' \\) -not -path './.git/*' -print0)
