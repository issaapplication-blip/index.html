name: RAFIQ static site quality
on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ops/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - 'manifest.webmanifest'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ops/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build allowlisted public artifact
        run: bash ops/build-static-site.sh
      - name: Validate deployed links, redirects, sitemap and PWA assets
        run: python ops/verify-static-site.py dist
      - name: Ensure source and operational files are not deployed
        run: |
          set -Eeuo pipefail
          for path in .github docs migrations ops supabase tests node_modules; do
            test ! -e "dist/$path" || { echo "Private path in public artifact: $path"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse deployed JavaScript files
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist -type f -name '*.mjs' -print0)
