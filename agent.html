<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f58"><title>WISAL | مختبر الوكيل</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f6;color:#17372d;font-family:Arial,Tahoma,sans-serif}main{max-width:900px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0001}.logo{width:170px;display:block;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.btn{border:0;border-radius:10px;padding:12px;background:#087f58;color:#fff;font-weight:bold;cursor:pointer}.red{background:#d71939}.alt{background:#eaf8f2;color:#17372d}.chat{min-height:260px;border:1px solid #dce8e2;border-radius:12px;padding:12px;background:#fbfdfc}.bubble{padding:10px;border-radius:12px;margin:8px 0;max-width:85%}.bot{background:#edf8f2}.user{background:#eef5ff;margin-right:auto}.gate{padding:14px;border:2px solid #d71939;border-radius:12px;background:#fff6f7}textarea{width:100%;padding:11px;border:1px solid #cbdad3;border-radius:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap}</style></head><body><main><section class="card"><img class="logo" src="./assets/wisal-logo.svg" alt="WISAL"><h1>مختبر وكيل WISAL</h1><p>نسخة تجريبية لا تتصل بأي جهة خارجية. الهدف اختبار منطق الوكيل قبل ربطه بخادم آمن.</p></section><section class="card"><h2>1) اختر السيناريو</h2><div class="grid"><button class="btn" data-s="visitor">زائر</button><button class="btn" data-s="caregiver">مقدم رعاية</button><button class="btn" data-s="nurse">ممرض/ة</button><button class="btn" data-s="physio">معالج فيزيائي</button><button class="btn" data-s="family">عائلة</button><button class="btn" data-s="institution">مؤسسة/مركز</button></div></section><section class="card"><h2>2) المحادثة</h2><div id="chat" class="chat"><div class="bubble bot">أهلاً بك في WISAL 🌷 كيف يمكنني مساعدتك اليوم؟</div></div><textarea id="input" placeholder="اكتب ردك هنا..."></textarea><div class="actions"><button class="btn" id="send">إرسال</button><button class="btn alt" id="reset">إعادة التجربة</button></div></section><section class="card gate"><h2>🛡️ بوابة القرار</h2><p id="gate">لا يوجد إجراء خارجي. الوكيل في هذه النسخة يجمع المعلومات فقط.</p><div class="actions"><button class="btn red" id="approve">محاكاة موافقة الإدارة</button><button class="btn alt" id="deny">رفض الإجراء</button></div></section><section class="card"><h2>سجل التجربة</h2><pre id="log">[]</pre></section></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),log=document.querySelector('#log');let scenario='visitor',state={step:0,external:false};const scripts={visitor:'أهلاً بك في WISAL. الانتساب مجاني، ويمكنك التسجيل كعائلة أو مقدم رعاية أو ممرض/ة أو معالج/ة فيزيائي/ة. ماذا تريد؟',caregiver:'أهلاً بك 🌷 سنجمع بياناتك المهنية وخبرتك ومناطق عملك، ويمكنك إضافة أفراد الأسرة الموجودين معك للاستفادة من المزايا وفق شروط كل عرض.',nurse:'أهلاً بك 👩‍⚕️ سنسجل الاختصاص والمؤهلات والخبرة والخدمات ومناطق العمل، ثم يخضع الملف للمراجعة والتحقق.',physio:'أهلاً بك 🧑‍⚕️ سنسجل الاختصاص والخبرة والخدمات والمناطق، ثم نراجع الملف قبل أي اعتماد.',family:'أهلاً بك 👨‍👩‍👧 سنساعدك في تجهيز طلب الرعاية وبيانات الشخص المحتاج للرعاية والموقع والجدول والاحتياجات.',institution:'أهلاً بكم. الانتساب إلى WISAL مجاني ولا توجد رسوم اشتراك. نود التواصل مع مسؤول الشراكات لديكم عبر البريد الرسمي بعد التعارف الأولي عبر قناة واتساب الرسمية.'};function say(t,who='bot'){chat.insertAdjacentHTML('beforeend',`<div class="bubble ${who}">${t}</div>`);chat.scrollTop=chat.scrollHeight}function addLog(e){const a=JSON.parse(log.textContent);a.push({...e,at:new Date().toISOString()});log.textContent=JSON.stringify(a,null,2)}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scenario=b.dataset.s;state={step:0,external:false};say(scripts[scenario]);addLog({event:'scenario_selected',scenario})});document.querySelector('#send').onclick=()=>{const t=input.value.trim();if(!t)return;say(t,'user');input.value='';state.step++;addLog({event:'user_input',scenario,text:t});let reply='شكرًا. سأرتب المعلومات وأحدد البيانات الناقصة. لا أتخذ قرار قبول أو عقد من تلقاء نفسي.';if(scenario==='institution'&&state.step===1)reply='شكرًا. أحتاج البريد الإلكتروني الرسمي للشخص المسؤول عن الشراكات لإرسال المقترح الرسمي. لن أرسل أي رسالة قبل موافقة الإدارة.';if(scenario!=='institution'&&state.step===1)reply='تم. بعد اكتمال البيانات سأرسل النتيجة إلى إدارة WISAL للمراجعة. لا يوجد قبول نهائي تلقائي.';say(reply);addLog({event:'agent_response',text:reply})};document.querySelector('#approve').onclick=()=>{state.external=true;say('تمت محاكاة موافقة الإدارة. في الإنتاج، عند هذه النقطة فقط يمكن تنفيذ الإجراء المحدد والمصرح به.');addLog({event:'admin_approval',approved:true})};document.querySelector('#deny').onclick=()=>{state.external=false;say('تم رفض الإجراء. لن يتم أي اتصال خارجي.');addLog({event:'admin_approval',approved:false})};document.querySelector('#reset').onclick=()=>location.reload();</script></body></html>
