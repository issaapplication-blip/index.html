<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>معاينة تجريبية | رعاية منزلية متألقة</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    .preview-notice {
      margin: 0;
      padding: 10px 16px;
      background: #17372d;
      color: #fff;
      font: 14px Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 42px);
      min-height: 640px;
      border: 0;
    }
  </style>
</head>
<body>
  <p class="preview-notice">نسخة معاينة تجريبية للواجهة الحالية فقط</p>
  <iframe
    class="preview-frame"
    src="index.html"
    title="معاينة منصة رعاية منزلية متألقة">
  </iframe>
</body>
</html>
